name: Feature request
description: 提议一个有明确场景和成本边界的功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景，不要只写功能名称。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 最小方案
      description: 说明最小可验证版本和明确不做的范围。
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 隐私、权限与费用影响
      description: 是否新增云请求、录音、存储、系统权限或第三方费用？
    validations:
      required: true

  - type: textarea
    id: fallback
    attributes:
      label: 失败回退
      description: 网络、模型或目标应用失败时，用户还能拿到什么结果？
